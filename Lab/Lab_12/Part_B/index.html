<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Session and Cookie Lab</title>
	<style>
		:root { color-scheme: light; font-family: system-ui, sans-serif; }
		body { margin: 0; background: #f4f7fb; color: #172033; }
		main { width: min(720px, calc(100% - 32px)); margin: 48px auto; }
		section { background: white; border: 1px solid #dce3ee; border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px #17203312; }
		h1 { margin-top: 0; }
		p { line-height: 1.5; }
		a, button { color: #075985; }
		.links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
	</style>
</head>
<body>
	<main>
		<section>
			<h1>Session and Cookie Management</h1>
			<p>Run <code>npm install</code>, then <code>npm start</code> to open the Node.js experiment.</p>
			<div class="links">
				<a href="/login">Login</a>
				<a href="/register">Register</a>
				<a href="/todo">Session To-Do List</a>
			</div>
		</section>
	</main>
</body>
</html>
