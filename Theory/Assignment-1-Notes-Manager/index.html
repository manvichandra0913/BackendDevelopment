<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noted — Personal Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #f5f1e8;
            --muted: #a9adbb;
            --paper: rgba(23, 29, 49, 0.86);
            --paper-solid: #1a2138;
            --line: rgba(224, 230, 255, 0.12);
            --accent: #ffb86c;
            --accent-deep: #eb7b54;
            --mint: #84d7bc;
            --danger: #ff7878;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            color: var(--ink);
            background: #0c1020;
            background-image:
                radial-gradient(circle at 8% 8%, rgba(255, 134, 107, 0.2), transparent 26rem),
                radial-gradient(circle at 92% 88%, rgba(99, 173, 214, 0.2), transparent 27rem),
                linear-gradient(135deg, #0c1020 0%, #141a31 52%, #10172a 100%);
            min-height: 100vh;
            padding: 54px 24px;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
        }

        header {
            position: relative;
            overflow: hidden;
            background: var(--paper);
            backdrop-filter: blur(14px);
            padding: 44px;
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
            margin-bottom: 18px;
        }

        header::after {
            content: 'NOTED';
            position: absolute;
            right: -11px;
            top: -24px;
            font-family: 'Playfair Display', serif;
            font-size: 7rem;
            font-weight: 700;
            letter-spacing: -0.1em;
            color: rgba(255, 255, 255, 0.035);
            pointer-events: none;
        }

        h1 {
            position: relative;
            color: var(--ink);
            font-family: 'Playfair Display', serif;
            letter-spacing: -0.045em;
            margin-bottom: 8px;
            font-size: clamp(2.5rem, 7vw, 4rem);
            line-height: 1;
            z-index: 1;
        }

        .subtitle {
            position: relative;
            color: var(--muted);
            font-size: 1rem;
            max-width: 460px;
            line-height: 1.6;
            margin-bottom: 30px;
            z-index: 1;
        }

        .form-group {
            position: relative;
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            z-index: 1;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 14px 16px;
            color: var(--ink);
            background: rgba(7, 11, 25, 0.42);
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        input[type="text"]::placeholder {
            color: #7f8496;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(7, 11, 25, 0.72);
            box-shadow: 0 0 0 4px rgba(255, 184, 108, 0.12);
        }

        button {
            padding: 13px 22px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
            color: #201319;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1em;
            font-family: inherit;
            font-weight: 700;
            transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.06);
            box-shadow: 0 9px 22px rgba(235, 123, 84, 0.22);
        }

        button:active {
            transform: translateY(0);
        }

        .stats {
            position: relative;
            background: rgba(7, 11, 25, 0.28);
            border: 1px solid var(--line);
            padding: 17px 10px;
            border-radius: 16px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            z-index: 1;
        }

        .stat {
            color: var(--ink);
            flex: 1;
            border-right: 1px solid var(--line);
        }

        .stat:last-child {
            border-right: 0;
        }

        .stat-number {
            font-family: 'DM Mono', monospace;
            font-size: 1.55em;
            font-weight: 500;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.72em;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-top: 7px;
        }

        main {
            background: var(--paper);
            backdrop-filter: blur(14px);
            padding: 30px;
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 14px;
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85em;
            font-weight: 600;
        }

        .filter-btn.active {
            background: var(--ink);
            color: #182038;
            border-color: var(--ink);
            box-shadow: none;
        }

        .filter-btn:hover {
            transform: none;
            border-color: var(--accent);
            box-shadow: none;
        }

        .notes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .note-card {
            background: rgba(9, 14, 31, 0.43);
            border: 1px solid var(--line);
            border-left: 3px solid var(--accent);
            padding: 21px;
            border-radius: 14px;
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, border-color 0.2s, background 0.2s;
        }

        .note-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 184, 108, 0.45);
            background: rgba(14, 21, 42, 0.75);
        }

        .note-card.completed {
            background: rgba(66, 104, 101, 0.17);
            border-left-color: var(--mint);
            opacity: 0.82;
        }

        .note-card.completed .note-text {
            text-decoration: line-through;
            color: #9ca6b0;
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .note-text {
            color: var(--ink);
            font-size: 1.08em;
            line-height: 1.5;
            margin-bottom: 8px;
            word-wrap: break-word;
        }

        .note-time {
            font-family: 'DM Mono', monospace;
            font-size: 0.7em;
            color: #858b9e;
            margin-bottom: 15px;
            line-height: 1.65;
        }

        .note-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 7px 11px;
            font-size: 0.75em;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-complete {
            background: rgba(132, 215, 188, 0.14);
            color: var(--mint);
            border: 1px solid rgba(132, 215, 188, 0.24);
        }

        .btn-complete:hover {
            background: rgba(132, 215, 188, 0.25);
            box-shadow: none;
        }

        .btn-edit {
            background: rgba(255, 184, 108, 0.13);
            color: var(--accent);
            border: 1px solid rgba(255, 184, 108, 0.22);
        }

        .btn-edit:hover {
            background: rgba(255, 184, 108, 0.24);
            box-shadow: none;
        }

        .btn-delete {
            background: rgba(255, 120, 120, 0.12);
            color: var(--danger);
            border: 1px solid rgba(255, 120, 120, 0.22);
        }

        .btn-delete:hover {
            background: rgba(255, 120, 120, 0.24);
            box-shadow: none;
        }

        .empty-state {
            text-align: center;
            padding: 58px 20px;
            color: var(--muted);
        }

        .empty-state-icon {
            font-size: 3.2em;
            margin-bottom: 12px;
            filter: saturate(0.75);
        }

        .empty-state-text {
            color: var(--ink);
            font-family: 'Playfair Display', serif;
            font-size: 1.5em;
            margin-bottom: 7px;
        }

        .clear-all-btn {
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(255, 120, 120, 0.35);
            width: 100%;
            margin-top: 20px;
        }

        .edit-form {
            background: #12192d;
            padding: 15px;
            border: 1px solid var(--line);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .edit-form input {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            color: var(--ink);
            background: #0d1325;
            border: 1px solid var(--line);
            border-radius: 6px;
        }

        .edit-form button {
            margin-right: 10px;
        }

        .info-box {
            background: rgba(129, 168, 239, 0.1);
            border: 1px solid rgba(129, 168, 239, 0.16);
            border-left: 3px solid #8ab1ff;
            padding: 13px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #bcccf2;
            font-size: 0.88em;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 14px;
            }

            .container {
                padding: 0;
            }

            header, main {
                border-radius: 18px;
            }

            header {
                padding: 30px 22px;
            }

            main {
                padding: 22px;
            }

            .form-group {
                flex-direction: column;
            }

            .form-group > button {
                width: 100%;
            }

            .stats {
                gap: 0;
            }

            .stat {
                border-right: 1px solid var(--line);
            }

            .stat-label {
                font-size: 0.6em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER SECTION -->
        <header>
            <h1>Notes Manager</h1>
            <p class="subtitle">Create, update, complete, filter, and delete notes in your browser.</p>

            <!-- ADD NEW NOTE FORM -->
            <div class="form-group">
                <input 
                    type="text" 
                    id="noteInput" 
                    placeholder="Write your note here... (max 200 characters)" 
                    maxlength="200"
                >
                <button onclick="addNote()">Add Note</button>
            </div>

            <!-- STATISTICS -->
            <div class="stats">
                <div class="stat">
                    <div class="stat-number" id="totalNotes">0</div>
                    <div class="stat-label">Total Notes</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="completedCount">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="pendingCount">0</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main>
            <div class="info-box">
                [INFO] Notes are saved in localStorage and remain available after closing the browser.
            </div>

            <!-- FILTER BUTTONS -->
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterNotes('all', this)">All</button>
                <button class="filter-btn" onclick="filterNotes('pending', this)">Pending</button>
                <button class="filter-btn" onclick="filterNotes('completed', this)">Completed</button>
            </div>

            <!-- NOTES DISPLAY AREA -->
            <div class="notes-list" id="notesList">
                <div class="empty-state">
                    <div class="empty-state-icon">&#128221;</div>
                    <div class="empty-state-text">No notes yet</div>
                    <p>Create your first note above to get started!</p>
                </div>
            </div>

            <!-- CLEAR ALL BUTTON -->
            <button class="clear-all-btn" onclick="clearAllNotes()">Clear All Notes</button>
        </main>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // ===========================
        // DATA MANAGEMENT FUNCTIONS
        // ===========================

        // Storage key name
        const STORAGE_KEY = 'assignment1NotesManager';
        let currentFilter = 'all';

        // Get all notes from localStorage
        function getNotes() {
            const json = localStorage.getItem(STORAGE_KEY);
            if (!json) return [];

            try {
                const notes = JSON.parse(json);
                return Array.isArray(notes) ? notes : [];
            } catch (error) {
                console.error('Could not read saved notes:', error);
                return [];
            }
        }

        // Save notes to localStorage
        function saveNotes(notes) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
            console.log('[INFO] Notes saved to localStorage. Total:', notes.length);
        }

        // ===========================
        // CRUD OPERATIONS
        // ===========================

        // CREATE: Add a new note
        function addNote() {
            const input = document.getElementById('noteInput');
            const text = input.value.trim();

            // Validation
            if (text === '') {
                alert('Please enter a note!');
                return;
            }

            // Create note object
            const note = {
                id: Date.now(), // Use timestamp as unique ID
                text: text,
                completed: false,
                createdAt: new Date().toLocaleString(),
                updatedAt: null
            };

            // Add to storage
            const notes = getNotes();
            notes.unshift(note); // Add to beginning
            saveNotes(notes);

            // Clear input
            input.value = '';
            input.focus();

            // Refresh display
            renderNotes();

            console.log('[OK] Note added:', note.text);
        }

        // READ: Get a specific note
        function getNote(id) {
            const notes = getNotes();
            return notes.find(note => note.id === id);
        }

        // UPDATE: Mark note as complete/incomplete
        function toggleComplete(id) {
            const notes = getNotes();
            const note = notes.find(n => n.id === id);
            
            if (note) {
                note.completed = !note.completed;
                note.updatedAt = new Date().toLocaleString();
                saveNotes(notes);
                renderNotes();
                console.log('[OK] Note toggled:', note.text);
            }
        }

        // UPDATE: Edit note text
        function editNote(id) {
            const note = getNote(id);
            const newText = prompt('Edit your note:', note.text);

            if (newText !== null && newText.trim() !== '') {
                const notes = getNotes();
                const noteToUpdate = notes.find(n => n.id === id);
                noteToUpdate.text = newText.trim();
                noteToUpdate.updatedAt = new Date().toLocaleString();
                saveNotes(notes);
                renderNotes();
                console.log('[OK] Note updated:', noteToUpdate.text);
            }
        }

        // DELETE: Remove a specific note
        function deleteNote(id) {
            if (confirm('Are you sure you want to delete this note?')) {
                let notes = getNotes();
                notes = notes.filter(note => note.id !== id);
                saveNotes(notes);
                renderNotes();
                console.log('[OK] Note deleted');
            }
        }

        // DELETE: Clear all notes
        function clearAllNotes() {
            if (confirm('Are you sure? This will delete ALL notes!')) {
                localStorage.removeItem(STORAGE_KEY);
                renderNotes();
                console.log('[OK] All notes cleared');
            }
        }

        // ===========================
        // DISPLAY FUNCTIONS
        // ===========================

        // Filter notes based on status
        function filterNotes(status, button) {
            currentFilter = status;

            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            button.classList.add('active');

            renderNotes();
        }

        // Render all notes to the page
        function renderNotes() {
            const notes = getNotes();
            const listContainer = document.getElementById('notesList');

            // Filter notes based on current filter
            let filteredNotes = notes;
            if (currentFilter === 'completed') {
                filteredNotes = notes.filter(n => n.completed);
            } else if (currentFilter === 'pending') {
                filteredNotes = notes.filter(n => !n.completed);
            }

            // Update statistics
            updateStats(notes);

            // Check if empty
            if (notes.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">&#128221;</div>
                        <div class="empty-state-text">No notes yet</div>
                        <p>Create your first note above to get started!</p>
                    </div>
                `;
                return;
            }

            // Display filtered notes
            if (filteredNotes.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-text">No ${currentFilter} notes</div>
                    </div>
                `;
                return;
            }

            // Create HTML for each note
            listContainer.innerHTML = filteredNotes.map(note => `
                <div class="note-card ${note.completed ? 'completed' : ''}">
                    <div class="note-header">
                        <div class="note-text">${escapeHtml(note.text)}</div>
                    </div>
                    <div class="note-time">
                        Created: ${note.createdAt}
                        ${note.updatedAt ? `<br>Updated: ${note.updatedAt}` : ''}
                    </div>
                    <div class="note-actions">
                        <button class="btn-small btn-complete" onclick="toggleComplete(${note.id})">
                            ${note.completed ? 'Undo' : 'Complete'}
                        </button>
                        <button class="btn-small btn-edit" onclick="editNote(${note.id})">Edit</button>
                        <button class="btn-small btn-delete" onclick="deleteNote(${note.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Update statistics display
        function updateStats(notes) {
            const total = notes.length;
            const completed = notes.filter(n => n.completed).length;
            const pending = total - completed;

            document.getElementById('totalNotes').textContent = total;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('pendingCount').textContent = pending;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===========================
        // EVENT LISTENERS
        // ===========================

        // Add note when Enter key is pressed
        document.getElementById('noteInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addNote();
            }
        });

        // ===========================
        // INITIALIZATION
        // ===========================

        // Load notes when page loads
        window.addEventListener('DOMContentLoaded', function() {
            console.log('[INFO] Notes Manager loaded');
            console.log('[INFO] localStorage available:', typeof(Storage) !== 'undefined');
            
            const notes = getNotes();
            console.log('[INFO] Notes in storage:', notes.length);
            
            renderNotes();

            // Auto-focus on input
            document.getElementById('noteInput').focus();
        });

        // ===========================
        // CONSOLE CHEAT SHEET
        // ===========================
        console.log(`
========================================
NOTES MANAGER - CONSOLE COMMANDS
========================================

Get all notes:
  >>> getNotes()

Add a note manually:
  >>> const notes = getNotes();
  >>> notes.push({id: Date.now(), text: 'New note', completed: false, createdAt: new Date().toLocaleString(), updatedAt: new Date().toLocaleString()});
  >>> saveNotes(notes);
  >>> renderNotes();

See raw localStorage:
  >>> localStorage.getItem('assignment1NotesManager')

Delete all notes:
  >>> localStorage.removeItem('assignment1NotesManager');
  >>> renderNotes();

Export notes as JSON:
  >>> JSON.stringify(getNotes(), null, 2)

Print all keys in storage:
  >>> console.table(localStorage)

Check storage size:
  >>> new Blob(Object.values(localStorage)).size + ' bytes'

========================================
        `);
    </script>
</body>
</html>
